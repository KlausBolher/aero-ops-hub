/* =========================================================================
   AUTH GATE  (Firebase email-link sign-in + Firestore allow-list)
   ========================================================================= */
// ---- 1) Fill in your Firebase project config here (Firebase console →
//         Project settings → General → Your apps → SDK setup and config) ----
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCNHUiv4HIja_qtrJwkWgZ6u0PzrKLVsr4",
  authDomain: "aero-ops-hub.firebaseapp.com",
  projectId: "aero-ops-hub",
  storageBucket: "aero-ops-hub.firebasestorage.app",
  messagingSenderId: "37958538588",
  appId: "1:37958538588:web:a96731c80a2b901f865d99"
};

firebase.initializeApp(FIREBASE_CONFIG);
const fbAuth = firebase.auth();
const fsDb = firebase.firestore();
let currentUser = null;
// Per-person module access, read from allowed_emails/{email} at sign-in.
// { modules: ['sqcdpte','surv','nc'] (subset), isAdmin: bool }. An admin
// always has full access to every module plus the Administration screen,
// regardless of what's in `modules`.
let myAccess = { modules:[], isAdmin:false };
function hasAccess(moduleId){ return !!(myAccess.isAdmin || (myAccess.modules||[]).includes(moduleId)); }
document.getElementById('gateLogoImg').src = document.getElementById('logoImg') ? document.getElementById('logoImg').src : '';

function gateShow(){ document.getElementById('authGate').classList.remove('hidden'); document.getElementById('app').style.display='none'; }
function gateHide(){ document.getElementById('authGate').classList.add('hidden'); document.getElementById('app').style.display=''; }
function gateMsg(text, kind){
  const box = document.getElementById('gateMsg');
  box.innerHTML = text ? `<div class="gate-msg ${kind||'info'}">${esc(text)}</div>` : '';
}

async function boot(){
  goto('home');
  await initDb();
  await initPresence();
}

// Called once on every load: if this URL IS the sign-in link the user
// clicked from their inbox, complete the sign-in.
async function completeEmailLinkSignInIfNeeded(){
  if(!fbAuth.isSignInWithEmailLink(window.location.href)) return;
  let email = null;
  try{ email = localStorage.getItem('aeroops_pending_email'); }catch(e){}
  if(!email){ email = (prompt('Confirme ton adresse courriel pour terminer la connexion :')||'').trim().toLowerCase(); }
  if(!email) return;
  try{
    await fbAuth.signInWithEmailLink(email, window.location.href);
    try{ localStorage.removeItem('aeroops_pending_email'); }catch(e){}
    history.replaceState({}, document.title, window.location.pathname);
  }catch(e){
    gateShow();
    gateMsg('Le lien de connexion est invalide ou a expiré. Redemande un nouveau lien ci-dessous.', 'error');
  }
}

let myAccessUnsub = null;
fbAuth.onAuthStateChanged(async (user)=>{
  if(myAccessUnsub){ myAccessUnsub(); myAccessUnsub=null; }
  if(!user){ currentUser=null; gateShow(); return; }
  const email = (user.email||'').toLowerCase();
  try{
    const allowDoc = await fsDb.collection('allowed_emails').doc(email).get();
    if(!allowDoc.exists){
      gateShow();
      gateMsg('Cette adresse (' + email + ') n’est pas autorisée à accéder à cet outil. Contacte l’administrateur pour être ajouté à la liste.', 'error');
      await fbAuth.signOut();
      return;
    }
    const data = allowDoc.data() || {};
    myAccess = { modules: Array.isArray(data.modules) ? data.modules : [], isAdmin: data.isAdmin===true };
  }catch(e){
    gateShow();
    gateMsg('Erreur de vérification d’accès. Réessaie plus tard.', 'error');
    return;
  }
  currentUser = user;
  me.id = user.uid;
  if(!me.name) me.name = email.split('@')[0];
  gateHide();
  boot();
  // Keep access live: if an admin changes this person's modules/admin flag,
  // or revokes them entirely, it takes effect immediately without a reload.
  myAccessUnsub = fsDb.collection('allowed_emails').doc(email).onSnapshot(snap=>{
    if(!currentUser) return;
    if(!snap.exists){ fbAuth.signOut(); return; }
    const data = snap.data() || {};
    myAccess = { modules: Array.isArray(data.modules) ? data.modules : [], isAdmin: data.isAdmin===true };
    if(!hasAccess(state.route) && state.route!=='home'){ state.route='home'; }
    renderShell();
  }, e=>console.warn('access watch', e));
});

document.getElementById('gateSendBtn').addEventListener('click', async ()=>{
  const input = document.getElementById('gateEmailInput');
  const email = (input.value||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ gateMsg('Adresse courriel invalide.', 'error'); return; }
  const btn = document.getElementById('gateSendBtn');
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  const actionCodeSettings = { url: window.location.href.split('?')[0].split('#')[0], handleCodeInApp: true };
  try{
    await fbAuth.sendSignInLinkToEmail(email, actionCodeSettings);
    try{ localStorage.setItem('aeroops_pending_email', email); }catch(e){}
    document.getElementById('gateForm').style.display='none';
    gateMsg('Lien envoyé à ' + email + '. Ouvre ta boîte de réception et clique le lien pour te connecter (même appareil ou non).', 'info');
  }catch(e){
    gateMsg('Erreur d’envoi : ' + (e.message||e.code||'inconnue') + '.', 'error');
  }
  btn.disabled = false; btn.textContent = 'Recevoir le lien de connexion';
});

completeEmailLinkSignInIfNeeded();
</script>
