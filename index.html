<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aero Ops Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Lato:wght@400;700;900&family=JetBrains+Mono:wght@500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<!-- Firebase (compat SDK — same chainable collection()/doc()/onSnapshot() API used throughout this app) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{color-scheme:light}
:root{
  --navy:#0A1E3D; --navy-2:#122A50; --lime:#C2D500; --grey:#97989A;
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#F8F9FB;
  --ink:#141A24; --ink-soft:#4B5566; --ink-faint:#8892A0;
  --line:#E1E4EA; --line-strong:#C7CCD6;
  --ok:#2E9E5B; --ok-bg:#E4F6EC; --nok:#D64545; --nok-bg:#FBE7E7; --na:#B9BDC6; --na-bg:#EEEFF2;
  --future:#E9EBEF;
  --prog-1:#EEEFF2; --prog-1-ink:#4B5566;
  --prog-2:#FFE9A8; --prog-2-ink:#5C4400;
  --prog-3:#C9EAD4; --prog-3-ink:#175A33;
  --prog-4:#2E9E5B; --prog-4-ink:#FFFFFF;
  --shadow: 0 1px 2px rgba(20,26,36,.06), 0 6px 20px -8px rgba(20,26,36,.15);
  --radius: 14px;
  --font-display:'Oswald',Arial,sans-serif;
  --font-body:'Lato',Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --font-hand:'Kalam','Comic Sans MS',cursive;
  /* module accents */
  --m-sqcdpte:#0A1E3D; --m-surv:#0E6E7C; --m-nc:#A23B2E; --m-future:#97989A;
  /* NC criticality levels (P-1021 §5.4: 1=yellow, 2=orange, 3=red) */
  --lvl2-bg:#FFE1C2; --lvl2-ink:#9A4B00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --surface:#121A2C; --surface-2:#0E1626;
    --ink:#E9ECF3; --ink-soft:#AEB7C6; --ink-faint:#727C8D;
    --line:#22304A; --line-strong:#324262;
    --ok:#3FBE79; --ok-bg:#0F2A1C; --nok:#F0635C; --nok-bg:#341417; --na:#7C8598; --na-bg:#1B2334;
    --future:#182236;
    --prog-1:#1B2334; --prog-1-ink:#AEB7C6;
    --prog-2:#4A3B12; --prog-2-ink:#F5D992;
    --prog-3:#123822; --prog-3-ink:#8FE0AE;
    --prog-4:#2E9E5B; --prog-4-ink:#08150D;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.6);
    --m-sqcdpte:#4A6FA5; --m-surv:#2FB4C4; --m-nc:#E07A5F; --m-future:#7C8598;
    --lvl2-bg:#4A2A0F; --lvl2-ink:#F5B77A;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121A2C; --surface-2:#0E1626;
  --ink:#E9ECF3; --ink-soft:#AEB7C6; --ink-faint:#727C8D;
  --line:#22304A; --line-strong:#324262;
  --ok:#3FBE79; --ok-bg:#0F2A1C; --nok:#F0635C; --nok-bg:#341417; --na:#7C8598; --na-bg:#1B2334;
  --future:#182236;
  --prog-1:#1B2334; --prog-1-ink:#AEB7C6;
  --prog-2:#4A3B12; --prog-2-ink:#F5D992;
  --prog-3:#123822; --prog-3-ink:#8FE0AE;
  --prog-4:#2E9E5B; --prog-4-ink:#08150D;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.6);
  --m-sqcdpte:#4A6FA5; --m-surv:#2FB4C4; --m-nc:#E07A5F; --m-future:#7C8598;
  --lvl2-bg:#4A2A0F; --lvl2-ink:#F5B77A;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:var(--font-display); text-wrap:balance;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; color:inherit;}
a{color:inherit;}
::selection{background:var(--lime); color:var(--navy);}

/* ============================= APP SHELL ============================= */
#app{height:100vh; min-height:100vh; display:flex; flex-direction:column; overflow:hidden;}
.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--navy); color:#fff;
  display:flex; align-items:center; gap:14px;
  padding:9px 18px; box-shadow: var(--shadow); flex:none;
}
.topbar .logo{height:32px; width:auto; display:block; border-radius:4px; background:#fff; padding:3px 6px;}
.topbar .titles{display:flex; flex-direction:column; line-height:1.15; margin-right:6px;}
.topbar .titles .k{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--lime); font-weight:700;}
.topbar .titles .t{font-family:var(--font-display); font-weight:600; font-size:16px;}
.projectpicker{display:flex; align-items:center; gap:6px; margin-left:6px;}
.projectpicker label{font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,255,.65); font-weight:700;}
.projectpicker select{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); color:#fff; border-radius:7px; padding:5px 8px; font-size:12.5px; font-weight:700; max-width:220px;}
.projectpicker select option{color:#141A24;}
.livepill{display:flex; align-items:center; gap:6px; font-size:11px; color:#cfd6e4; margin-left:auto; padding:5px 10px; border:1px solid rgba(255,255,255,.18); border-radius:999px; flex:none;}
.livedot{width:7px; height:7px; border-radius:50%; background:var(--grey); flex:none;}
.livepill.on .livedot{background:#5CE39A; box-shadow:0 0 0 3px rgba(92,227,154,.25);}
.livepill.off .livedot{background:#E3945C;}
.presence-namebox{display:flex; align-items:center; gap:6px;}
.presence-namebox label{font-size:10px; color:rgba(255,255,255,.7); text-transform:uppercase; letter-spacing:.05em;}
.presence-namebox input{width:74px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28); border-radius:6px; padding:4px 8px; font-size:11.5px; color:#fff;}
.presence-namebox input::placeholder{color:rgba(255,255,255,.5);}
.presence-row{display:flex; align-items:center; margin-left:2px;}
.avatar{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; border:2px solid var(--navy); margin-left:-8px; font-family:var(--font-mono); flex:none;}
.avatar:first-child{margin-left:0;}
.avatar.me{border-color:var(--lime); box-shadow:0 0 0 1px var(--lime);}

.body-row{flex:1; min-height:0; display:flex;}
.rail{
  flex:none; width:212px; background:var(--navy-2); color:#dfe4ee; display:flex; flex-direction:column;
  padding:14px 10px; gap:3px; overflow-y:auto;
}
.rail-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:none;
  background:transparent; color:inherit; font-size:13px; font-weight:700; text-align:left; width:100%;
  transition:background .15s;
}
.rail-item:hover{background:rgba(255,255,255,.08);}
.rail-item.active{background:rgba(255,255,255,.14); color:#fff;}
.rail-dot{width:9px; height:9px; border-radius:3px; flex:none; background:var(--rc,#fff);}
.rail-item.active .rail-dot{box-shadow:0 0 0 3px rgba(255,255,255,.14);}
.rail-item .rn{margin-left:auto; font-family:var(--font-mono); font-size:10.5px; font-weight:700; background:rgba(255,255,255,.12); border-radius:999px; padding:1px 7px;}
.rail-item.soon{opacity:.55; cursor:default;}
.rail-foot{margin-top:auto; padding:10px 12px; font-size:10.5px; color:rgba(255,255,255,.4); line-height:1.5;}

main{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;}
.view-pad{max-width:1360px; margin:0 auto; padding:22px 22px 60px;}

/* ============================= SHARED PANEL / FIELD / TABLE ============================= */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.panel + .panel{margin-top:18px;}
.panel-head{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.panel-head h2{margin:0; font-size:15px; letter-spacing:.03em; text-transform:uppercase; font-weight:600;}
.panel-head .sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
.panel-body{padding:18px;}
.grid-cols{display:grid; gap:16px;}
.row{display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start;}
.field{display:flex; flex-direction:column; gap:4px;}
.field label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700;}
.field input, .field select, .field textarea{
  background:var(--surface-2); border:1px solid var(--line-strong); border-radius:8px; padding:7px 10px; font-size:13.5px; color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--lime); outline-offset:1px; border-color:var(--lime);}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.03em;}
.pill.ok{background:var(--ok-bg); color:var(--ok);}
.pill.nok{background:var(--nok-bg); color:var(--nok);}
.pill.na{background:var(--na-bg); color:var(--na);}
.addbtn{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:8px 14px; font-weight:700; font-size:12.5px; display:flex; align-items:center; gap:6px;}
.addbtn:hover{background:var(--navy-2);}
.mtable{width:100%; border-collapse:collapse; font-size:13px;}
.mtable th{text-align:left; padding:7px 9px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); border-bottom:1px solid var(--line); white-space:nowrap;}
.mtable td{padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top;}
.mtable td.num{font-family:var(--font-mono); text-align:right;}
.mtable tr:hover td{background:var(--surface-2);}
.table-wrap{overflow-x:auto;}
.footer-note{text-align:center; color:var(--ink-faint); font-size:11px; padding:22px 0 6px;}

/* ============================= HOME ============================= */
.home-hero{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; padding:26px 0 18px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:22px;}
.home-hero h1{margin:0 0 6px; font-size:26px; font-weight:600;}
.home-hero p{margin:0; color:var(--ink-soft); font-size:13.5px; max-width:560px;}
.home-hero .proj{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em;}
.module-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;}
.mcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:0; overflow:hidden; text-align:left; display:flex; flex-direction:column; border-top:4px solid var(--mc,var(--navy));
}
.mcard.clickable{cursor:pointer; transition:transform .12s ease;}
.mcard.clickable:hover{transform:translateY(-2px);}
.mcard .mhead{display:flex; align-items:center; gap:12px; padding:16px 16px 10px;}
.mcard .micon{width:42px; height:42px; border-radius:11px; background:var(--mc,var(--navy)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:19px; font-weight:700; flex:none;}
.mcard .mname{font-family:var(--font-display); font-weight:600; font-size:16.5px;}
.mcard .mdesc{padding:0 16px 14px; font-size:12.5px; color:var(--ink-soft); line-height:1.45; flex:1;}
.mcard .mstats{display:flex; gap:14px; padding:12px 16px; border-top:1px solid var(--line); background:var(--surface-2);}
.mcard .mstat{display:flex; flex-direction:column; gap:1px;}
.mcard .mstat .v{font-family:var(--font-mono); font-weight:700; font-size:17px;}
.mcard .mstat .l{font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700;}
.mcard.soon{opacity:.65;}
.mcard.soon .mdesc{font-style:italic;}
.badge-soon{margin-left:auto; font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--ink-faint); border:1px dashed var(--line-strong); border-radius:999px; padding:2px 8px;}

/* ============================= KPI / HEATMAP (SQCDPTE + Surveillance share these) ============================= */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; padding:16px 18px;}
.kpi{
  border-top:4px solid var(--c); background:var(--surface-2); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:8px;
  cursor:pointer; transition:transform .12s ease;
}
.kpi:hover{transform:translateY(-2px);}
.kpi .khead{display:flex; align-items:center; gap:10px;}
.kpi .kbadge{width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none;
  font-family:var(--font-display); font-weight:700; font-size:22px; color:#fff; background:var(--c); box-shadow:var(--shadow);}
.kpi .kname{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700;}
.kpi .ktarget{font-size:11px; color:var(--ink-soft); line-height:1.35; min-height:30px;}
.kpi .kstat{display:flex; align-items:center; justify-content:space-between; margin-top:auto;}
.kpi .kactual{font-family:var(--font-mono); font-size:20px; font-weight:700;}
.kpi .kopen{font-size:11px; color:var(--ink-faint);}
.heatmap{padding:6px 18px 18px; overflow-x:auto;}
.heatmap table{border-collapse:collapse; width:100%; min-width:760px;}
.heatmap th, .heatmap td{padding:6px 4px; text-align:center; font-size:12px;}
.heatmap thead th{color:var(--ink-faint); font-weight:700; text-transform:uppercase; font-size:10px; letter-spacing:.05em;}
.heatmap tbody th{text-align:left; font-family:var(--font-display); font-weight:600; padding-left:6px; white-space:nowrap;}
.heatmap td .cell{width:100%; height:22px; border-radius:5px; display:block;}
.chart-wrap{padding:14px 18px 20px;}
.chart-wrap canvas{max-width:100%;}

/* ring / letter view */
.letter-head{display:flex; align-items:center; gap:16px; padding:18px; flex-wrap:wrap;}
.letter-badge{width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:28px; color:#fff; flex:none;}
.letter-titles{display:flex; flex-direction:column; gap:2px;}
.letter-titles .name{font-family:var(--font-display); font-weight:600; font-size:20px;}
.letter-titles .target{font-size:12.5px; color:var(--ink-soft); max-width:560px;}
.thresh-box{margin-left:auto; display:flex; gap:18px; align-items:flex-end;}
.ring-panel-body{display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:22px; padding:18px; align-items:center;}
@media (max-width:860px){.ring-panel-body{grid-template-columns:1fr;}}
.ring-nav{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:8px;}
.ring-nav button{background:var(--surface-2); border:1px solid var(--line-strong); border-radius:8px; width:30px; height:30px; font-size:15px; color:var(--ink);}
.ring-nav button:hover{background:var(--line);}
.ring-nav .period-label{font-family:var(--font-display); font-weight:600; font-size:15px; min-width:150px; text-align:center;}
.ring-wrap{display:flex; flex-direction:column; align-items:center;}
.ring-hint{font-size:11.5px; color:var(--ink-faint); margin-top:6px; text-align:center;}
.daycell{cursor:pointer; transition:transform .1s ease;}
.daycell:hover{transform:scale(1.14);}
.daycell:focus{outline:none;}
.legend-row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px;}
.legend-row .lg{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-soft);}
.legend-row .sw{width:11px; height:11px; border-radius:3px;}
.mtable tr.thism{background:var(--surface-2);}
.ci-note{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 18px; flex-wrap:wrap; border-bottom:1px solid var(--line);}
.ci-note p{margin:0; font-size:12.5px; color:var(--ink-soft); max-width:640px;}
.ci-counter{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line-strong); border-radius:10px; padding:6px 12px;}
.ci-counter .n{font-family:var(--font-mono); font-weight:700; font-size:18px; color:var(--nok);}
.ci-counter .n.zero{color:var(--ok);}
.ci-counter .l{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700;}

/* module-level tab bar (inside a module view, under the hub topbar) */
.mtabs{display:flex; gap:4px; padding:10px 22px 0; max-width:1360px; margin:0 auto; overflow-x:auto;}
.mtab{
  flex:none; display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:10px 10px 0 0;
  border:1px solid transparent; background:transparent; color:var(--ink-soft); font-weight:700; font-size:13px;
}
.mtab .sw{width:9px; height:9px; border-radius:3px; flex:none;}
.mtab:hover{background:var(--surface-2);}
.mtab.active{background:var(--surface); color:var(--ink); border-color:var(--line); border-bottom-color:var(--surface); box-shadow:0 -2px 0 var(--tc,var(--navy)) inset;}

/* canvas (pan/zoom), reused by the SQCDPTE module */
.canvas-viewport{position:relative; overflow:hidden; flex:1; min-height:420px; cursor:grab; touch-action:none;}
.canvas-viewport.panning{cursor:grabbing;}
.canvas-surface{transform-origin:0 0; will-change:transform; max-width:1360px; margin:0 auto; padding:22px 20px 60px;}
.canvas-controls{position:absolute; right:18px; bottom:18px; z-index:15; display:flex; flex-direction:column; align-items:center; gap:2px;
  background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:6px;}
.canvas-controls button{width:32px; height:32px; border:none; background:transparent; border-radius:6px; font-size:16px; font-weight:700; color:var(--ink); line-height:1;}
.canvas-controls button:hover{background:var(--surface-2);}
.canvas-controls .zoomlabel{font-size:9.5px; text-align:center; color:var(--ink-faint); font-family:var(--font-mono); padding:2px 0;}
.canvas-hint{position:absolute; left:18px; bottom:18px; z-index:15; font-size:10.5px; color:var(--ink-faint); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:5px 10px; box-shadow:var(--shadow); pointer-events:none;}

/* corkboard / kanban sticky notes, reused by SQCDPTE CI plan + Non-Conformites pipeline */
.corkboard{
  background:
    radial-gradient(circle at 12% 22%, rgba(0,0,0,.16) 0 2.5px, transparent 3px),
    radial-gradient(circle at 62% 58%, rgba(0,0,0,.14) 0 2.5px, transparent 3px),
    radial-gradient(circle at 38% 82%, rgba(0,0,0,.14) 0 2.5px, transparent 3px),
    radial-gradient(circle at 85% 18%, rgba(0,0,0,.14) 0 2.5px, transparent 3px),
    radial-gradient(circle at 22% 55%, rgba(0,0,0,.12) 0 2.5px, transparent 3px),
    radial-gradient(circle at 90% 75%, rgba(0,0,0,.12) 0 2.5px, transparent 3px),
    linear-gradient(150deg,#C89B6D,#AD7C48);
  background-size: 46px 46px, 46px 46px, 46px 46px, 46px 46px, 46px 46px, 46px 46px, cover;
  padding:16px; border-radius:0 0 var(--radius) var(--radius);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .corkboard{ filter:brightness(.68) saturate(.85);} }
:root[data-theme="dark"] .corkboard{ filter:brightness(.68) saturate(.85); }
.kanban{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start;}
.kanban.cols5{grid-template-columns:repeat(5,1fr);}
@media (max-width:1100px){.kanban{grid-template-columns:repeat(2,1fr);} .kanban.cols5{grid-template-columns:repeat(2,1fr);}}
@media (max-width:620px){.kanban{grid-template-columns:1fr;}}
.kcol{background:rgba(255,255,255,.24); border:1.5px dashed rgba(255,255,255,.55); border-radius:10px; padding:10px; min-height:170px; display:flex; flex-direction:column; gap:10px; transition:background .12s, border-color .12s;}
.kcol.dragover{background:rgba(255,255,255,.44); border-color:#fff;}
.kcol-head{font-family:var(--font-display); font-weight:600; font-size:11.5px; color:#3a2a15; text-transform:uppercase; letter-spacing:.03em; display:flex; justify-content:space-between; padding:0 2px;}
.kcol-head .cnt{font-family:var(--font-mono); font-weight:700;}

<script>
/* =========================================================================
   HELPERS (shared across modules)
   ========================================================================= */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
const PALETTE = ['#C00000','#2E9E5B','#1F6FB2','#6A3D9A','#B5690A','#17A398','#C2185B','#58595B'];
function colorFor(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h % PALETTE.length]; }
function initials(name){
  const t=(name||'').trim(); if(!t) return '?';
  const parts = t.split(/\s+/);
  return (parts[0][0]+(parts[1]?parts[1][0]:(parts[0][1]||''))).toUpperCase();
}
function noteRotation(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return (h%7)-3; }
function pastel(hex, mix){
  mix = mix==null ? 0.8 : mix;
  const n = parseInt(hex.slice(1),16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const R = Math.round(r+(255-r)*mix), G = Math.round(g+(255-g)*mix), B = Math.round(b+(255-b)*mix);
  return `rgb(${R},${G},${B})`;
}
const BRAND_PAPER = [{hex:'#0A1E3D', mix:0.89},{hex:'#C2D500', mix:0.72},{hex:'#97989A', mix:0.72}];
function paperFor(id){ let h=0; for(const c of String(id)) h=(h*17+c.charCodeAt(0))>>>0; const p = BRAND_PAPER[h % BRAND_PAPER.length]; return pastel(p.hex, p.mix); }
function getTok(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
async function ensureUpdate(ref, data){
  try{ await ref.update(data); }
  catch(e){ try{ await ref.set(data); }catch(e2){ console.warn('write failed', e2); } }
}

/* =========================================================================
   MODULE REGISTRY
   ========================================================================= */
const MODULES = [
  {id:'sqcdpte', name:'SQCDPTE Live Board', short:'SQ', color:'var(--m-sqcdpte)', desc:'Gestion visuelle quotidienne Safety / Quality / Cost / Delivery / People / Training / Environment.'},
  {id:'surv',    name:'Surveillances Opérationnelles', short:'SO', color:'var(--m-surv)', desc:'Questionnaires d’audit, planification par thème et surveyor, KPI sur les non-conformités.'},
  {id:'nc',      name:'Non-Conformités', short:'NC', color:'var(--m-nc)', desc:'Déclaration, analyse de cause, actions correctives et vérification d’efficacité (P-1021).'},
];

/* =========================================================================
   GLOBAL STATE
   ========================================================================= */
const state = {
  db:null, room:null, connected:false,
  route:'home',
  projects:[], projectId:null,
  sqcdpte:null, surv:null, nc:null, // lazily-initialized per-module state, see below
};

/* =========================================================================
   PROJECTS  (db.collection('projects'))
   ========================================================================= */
const DEFAULT_PROJECT = {id:'airbus-mobile-al', name:'Airbus Mobile AL — FAL', code:'AIRBUS-MOBILE', active:true, createdAt:Date.now()};
function currentProject(){ return state.projects.find(p=>p.id===state.projectId) || state.projects[0] || null; }
async function seedProjectsIfEmpty(){
  if(!state.db) return;
  try{
    const snap = await state.db.collection('projects').get();
    if(snap.empty){
      await state.db.collection('projects').doc(DEFAULT_PROJECT.id).set(DEFAULT_PROJECT);
    }
  }catch(e){ console.warn('seed projects failed', e); }
}
function watchProjects(){
  if(!state.db){
    state.projects = [DEFAULT_PROJECT];
    state.projectId = DEFAULT_PROJECT.id;
    renderShell();
    return;
  }
  state.db.collection('projects').onSnapshot(qs=>{
    let list = qs.docs.map(d=>Object.assign({id:d.id}, d.data()));
    if(list.length===0) list = [DEFAULT_PROJECT];
    list.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    state.projects = list;
    if(!state.projectId || !list.find(p=>p.id===state.projectId)) state.projectId = list[0].id;
    renderShell();
  }, e=>console.warn('projects', e));
}
async function addProject(name){
  name = (name||'').trim();
  if(!name) return;
  const id = 'proj-'+Date.now().toString(36);
  const doc = {id, name, code:name.toUpperCase().replace(/[^A-Z0-9]+/g,'-').slice(0,24), active:true, createdAt:Date.now()};
  if(state.db){ await state.db.collection('projects').doc(id).set(doc); }
  else { state.projects.push(doc); }
  state.projectId = id;
  renderShell();
}

/* =========================================================================
   DB / PRESENCE BOOTSTRAP  (Firebase Firestore — replaces the Claude
   Artifact `db`/`room` capabilities used in the in-Claude version)
   ========================================================================= */
async function initDb(){
  state.db = fsDb;
  const pill = document.getElementById('livepill');
  const txt = document.getElementById('livetext');
  pill.className='livepill on'; txt.textContent='En direct — partagé avec l’équipe';
  state.connected = true;
  await seedProjectsIfEmpty();
  watchProjects();
}

const me = { id:'u-'+Math.random().toString(36).slice(2,9), name:'' };
try{ me.name = localStorage.getItem('aeroops_name') || ''; }catch(e){}
me.color = colorFor(me.id);
let peers = {};
let presenceUnsub = null;
let presenceHeartbeat = null;
function renderPresence(){
  const row = document.getElementById('presenceRow');
  if(!row) return;
  const all = Object.assign({}, peers, {[me.id]:{name:me.name||'Me', color:me.color}});
  const ids = Object.keys(all);
  const shown = ids.slice(0,8);
  row.innerHTML = shown.map(id=>{
    const p = all[id];
    return `<div class="avatar ${id===me.id?'me':''}" style="background:${p.color||'#888'}" title="${esc(p.name||'Anonyme')}">${esc(initials(p.name))}</div>`;

// Firestore-backed presence: each tab writes a heartbeat doc every 15s; peers
// older than 45s are treated as gone. Doc id = the signed-in user's uid, so
// presence is tied to a real authenticated identity, not a random session id.
function pushPresence(){
  if(!state.db || !currentUser) return;
  ensureUpdate(state.db.doc('presence/'+me.id), {
    name: me.name||(currentUser.email||'').split('@')[0], color: me.color,
    route: state.route, email: currentUser.email||'', lastSeen: Date.now()
  });
}
async function initPresence(){
  const nameInput = document.getElementById('meNameInput');
  nameInput.value = me.name;
  nameInput.addEventListener('change', ()=>{
    me.name = nameInput.value.slice(0,12);
    try{ localStorage.setItem('aeroops_name', me.name); }catch(e){}
    pushPresence(); renderPresence();
  });
  renderPresence();
  if(!state.db || !currentUser) return;
  pushPresence();
  if(presenceHeartbeat) clearInterval(presenceHeartbeat);
  presenceHeartbeat = setInterval(pushPresence, 15000);
  if(presenceUnsub) presenceUnsub();
  presenceUnsub = state.db.collection('presence').onSnapshot(qs=>{
    const now = Date.now();
    peers = {};
    qs.docs.forEach(d=>{
      if(d.id===me.id) return;
      const p = d.data();
      if(now - (p.lastSeen||0) < 45000) peers[d.id] = {name:p.name, color:p.color};
    });
    renderPresence();
  }, e=>console.warn('presence', e));
}

function daysInMonth(year, monthIdx){ return new Date(year, monthIdx+1, 0).getDate(); }
function dayKey(year, monthIdx, day){ return year+'-'+String(monthIdx+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'); }
function weekKey(year, weekNum){ return year+'-W'+String(weekNum).padStart(2,'0'); }
function weekMonthIndex(year, weekNum){ const d = new Date(year,0,1 + (weekNum-1)*7); return d.getMonth(); }
function nextStatus(s){ const order=['','OK','NOK','N-A']; const i=order.indexOf(s||''); return order[(i+1)%order.length]; }
function statusColorVar(s){ if(s==='OK') return 'var(--ok)'; if(s==='NOK') return 'var(--nok)'; if(s==='N-A') return 'var(--na)'; return 'var(--future)'; }
function sqCountNOK(letter, filterFn){
  const cells = (sq().rings[letter]||{cells:{}}).cells || {};
  let n=0; for(const k in cells){ if(cells[k]==='NOK' && (!filterFn||filterFn(k))) n++; } return n;
}
function sqMonthActual(letter, monthIdx){
  const cat = SQ_CAT_BY_LETTER[letter]; const year = sq().settings.year;
  if(cat.grain==='daily'){ const prefix = year+'-'+String(monthIdx+1).padStart(2,'0')+'-'; return sqCountNOK(letter, k=>k.startsWith(prefix)); }
  return sqCountNOK(letter, k=>{ const m=/^(\d+)-W(\d+)$/.exec(k); if(!m) return false; if(parseInt(m[1],10)!==year) return false; return weekMonthIndex(year,parseInt(m[2],10))===monthIdx; });
}
function sqMonthStatus(letter, monthIdx){ const actual = sqMonthActual(letter,monthIdx); const thresh = sq().thresholds[letter]??0; return actual<=thresh?'OK':'NOK'; }
function sqOpenActionsCount(letter){ return sq().actions.filter(a=>a.letter===letter && !a.closingDate).length; }

function sqBuildRingSVG(cat){
  const daily = cat.grain==='daily'; const year = sq().settings.year;
  let n, keys, labels;
  if(daily){ const mIdx = sq().viewMonth[cat.letter]; n=daysInMonth(year,mIdx); keys=Array.from({length:n},(_,i)=>dayKey(year,mIdx,i+1)); labels=Array.from({length:n},(_,i)=>String(i+1)); }
  else { n=52; keys=Array.from({length:n},(_,i)=>weekKey(year,i+1)); labels=Array.from({length:n},(_,i)=>String(i+1)); }
  const size=400, cx=200, cy=200; const r = daily?148:168; const ptR = daily?15:10.5; const fontR = daily?9:7.5;
  let dots='';

function sqWireSticky(holder, updateFn, delFn, dragStartFn){
  holder.querySelectorAll('.sexpand').forEach(btn=>btn.addEventListener('click', ()=>{ const d=btn.nextElementSibling; d.hidden=!d.hidden; btn.textContent=d.hidden?'Details ▾':'Details ▴'; }));
  holder.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const card=el.closest('.stick');
      const val = el.disabled ? undefined : el.value;
      if(val!==undefined) updateFn(card.dataset.id, {[el.dataset.field]: val});
    });
    el.addEventListener('pointerdown', e=>e.stopPropagation());
  });
  holder.querySelectorAll('[data-act="del"]').forEach(btn=>btn.addEventListener('click', ()=>delFn(btn.closest('.stick').dataset.id)));
  const dragFn = dragStartFn || ((card,e)=>sqStartDragNote(card,e,updateFn));
  holder.querySelectorAll('.drag-handle').forEach(handle=>handle.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); dragFn(handle.closest('.stick'), e); }));
}
function sqStartDragNote(card, startEvent, updateFn){
  const id = card.dataset.id; card.classList.add('dragging');
  const ghost = card.cloneNode(true); ghost.classList.add('drag-ghost'); ghost.classList.remove('dragging'); document.body.appendChild(ghost);
  const move = e=>{
    ghost.style.left=(e.clientX-95)+'px'; ghost.style.top=(e.clientY-24)+'px';
    document.querySelectorAll('.kcol').forEach(c=>c.classList.remove('dragover'));
    const el = document.elementFromPoint(e.clientX,e.clientY); const col = el && el.closest('.kcol'); if(col) col.classList.add('dragover');
  };
  const up = e=>{
    document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
    card.classList.remove('dragging'); ghost.remove(); document.querySelectorAll('.kcol').forEach(c=>c.classList.remove('dragover'));
    const el = document.elementFromPoint(e.clientX,e.clientY); const col = el && el.closest('.kcol');
    if(col){ updateFn(id, {progress: col.dataset.progress}); }
  };
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); move(startEvent);
}

const sqCanvasView = {}; const sqFitDone = {};
function sqGetView(tab){ return sqCanvasView[tab] || (sqCanvasView[tab]={x:0,y:0,scale:1}); }
function sqApplyView(tab){
  const v = sqGetView(tab); const surf=document.getElementById('sqSurface');
  if(surf) surf.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.scale})`;
  const lbl=document.getElementById('sqZoomLabel'); if(lbl) lbl.textContent=Math.round(v.scale*100)+'%';
}
function sqFitToScreen(tab){
  const vp=document.getElementById('sqViewport'), surf=document.getElementById('sqSurface'); if(!vp||!surf) return;
  const cw=surf.scrollWidth, ch=surf.scrollHeight, vw=vp.clientWidth, vh=vp.clientHeight; if(!cw||!ch||!vw||!vh) return;
  let scale = Math.min(vw/cw, vh/ch)*0.97; scale = Math.min(1.6, Math.max(0.35, scale));
  sqCanvasView[tab] = {x:(vw-cw*scale)/2, y:(vh-ch*scale)/2, scale}; sqApplyView(tab);
}
function setupSqCanvas(){
  const tab = sq().activeTab; const vp=document.getElementById('sqViewport'); if(!vp) return;
  let panning=false, activePointers=0, startX=0,startY=0,startVX=0,startVY=0;
  vp.addEventListener('pointerdown', e=>{
    activePointers++;
    if(e.target.closest('.stick, button, input, select, textarea, .daycell, .kpi, .mtab')) return;
    if(activePointers>1){ panning=false; return; }
    panning=true; vp.classList.add('panning'); try{vp.setPointerCapture(e.pointerId);}catch(err){}
    startX=e.clientX; startY=e.clientY; const v=sqGetView(tab); startVX=v.x; startVY=v.y;
  });
  vp.addEventListener('pointermove', e=>{ if(!panning) return; const v=sqGetView(tab); v.x=startVX+(e.clientX-startX); v.y=startVY+(e.clientY-startY); sqApplyView(tab); });
  const endPan=()=>{ activePointers=Math.max(0,activePointers-1); panning=false; vp.classList.remove('panning'); };
  vp.addEventListener('pointerup', endPan); vp.addEventListener('pointercancel', endPan);
  vp.addEventListener('wheel', e=>{
    e.preventDefault(); const v=sqGetView(tab);
    if(e.ctrlKey){ const rect=vp.getBoundingClientRect(); const cx=e.clientX-rect.left, cy=e.clientY-rect.top; const factor=Math.exp(-e.deltaY*0.01); const newScale=Math.min(2.5,Math.max(0.35,v.scale*factor)); v.x=cx-(cx-v.x)*(newScale/v.scale); v.y=cy-(cy-v.y)*(newScale/v.scale); v.scale=newScale; }
    else { v.x-=e.deltaX; v.y-=e.deltaY; }
    sqApplyView(tab);
  }, {passive:false});
  let pinchStartDist=null, pinchStartScale=1;
  vp.addEventListener('touchstart', e=>{ if(e.touches.length===2){ panning=false; vp.classList.remove('panning'); pinchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); pinchStartScale=sqGetView(tab).scale; } }, {passive:true});
  vp.addEventListener('touchmove', e=>{ if(e.touches.length===2 && pinchStartDist){ e.preventDefault(); const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); const v=sqGetView(tab); v.scale=Math.min(2.5,Math.max(0.35,pinchStartScale*(dist/pinchStartDist))); sqApplyView(tab); } }, {passive:false});
  vp.addEventListener('touchend', e=>{ if(e.touches.length<2) pinchStartDist=null; }, {passive:true});
  const zi=document.getElementById('sqZoomIn'), zo=document.getElementById('sqZoomOut'), zr=document.getElementById('sqZoomReset');
  if(zi) zi.onclick=()=>{ const v=sqGetView(tab); v.scale=Math.min(2.5,v.scale*1.2); sqApplyView(tab); };
  if(zo) zo.onclick=()=>{ const v=sqGetView(tab); v.scale=Math.max(.35,v.scale/1.2); sqApplyView(tab); };
  if(zr) zr.onclick=()=>{ sqFitToScreen(tab); };
  if(!sqFitDone[tab]){ sqFitDone[tab]=true; requestAnimationFrame(()=>sqFitToScreen(tab)); } else { sqApplyView(tab); }
}

function svNormalizePlanning(d){
  // tolerate v1-shaped docs (single questionnaireId, no mode/answers-status) written before this upgrade

  if(d.locked==null) d.locked = d.mode==='planned';
  if(!d.answers) d.answers = [];

async function svSeedIfEmpty(pid){

/* ---- Executor: answer / question mutations ---- */
function svAnswerKey(qnId, questionId){ return qnId+'::'+questionId; }
function svGetAnswer(doc, qnId, questionId){
  return (doc.answers||[]).find(a=>a.questionnaireId===qnId && a.questionId===questionId);
}
function svSetAnswer(planId, qnId, questionId, patch){
  const doc = svPlanningById(planId); if(!doc) return;
  let a = svGetAnswer(doc, qnId, questionId);
  if(!a){ a = {questionnaireId:qnId, questionId, status:'conform', evidence:'', ncDescription:'', ncActionType:'immediate', naType:'temporaire', naNote:'', ncRecordId:null}; doc.answers = (doc.answers||[]).concat([a]); }
  Object.assign(a, patch);
  renderSurvBody();
  if(state.db) ensureUpdate(state.db.doc('surv_planning/'+planId), {answers: doc.answers});
}
function svAddQuestionnaireToExec(planId, qnId){
  const doc = svPlanningById(planId); if(!doc || !qnId) return;
  if((doc.questionnaireIds||[]).includes(qnId)) return;
  doc.questionnaireIds = (doc.questionnaireIds||[]).concat([qnId]);
  renderSurvBody();
  if(state.db) ensureUpdate(state.db.doc('surv_planning/'+planId), {questionnaireIds: doc.questionnaireIds});
}
function svRemoveQuestionnaireFromExec(planId, qnId){
  const doc = svPlanningById(planId); if(!doc) return;
  doc.questionnaireIds = (doc.questionnaireIds||[]).filter(x=>x!==qnId);
  doc.answers = (doc.answers||[]).filter(a=>a.questionnaireId!==qnId);
  renderSurvBody();
  if(state.db) ensureUpdate(state.db.doc('surv_planning/'+planId), {questionnaireIds: doc.questionnaireIds, answers: doc.answers});
}
function svAddAdditionalQuestion(planId){
  const doc = svPlanningById(planId); if(!doc) return;
  doc.additionalQuestions = (doc.additionalQuestions||[]).concat([{id:uid(), text:'', status:'conform', note:''}]);
  renderSurvBody();
  if(state.db) ensureUpdate(state.db.doc('surv_planning/'+planId), {additionalQuestions: doc.additionalQuestions});
}
function svUpdateAdditionalQuestion(planId, aqId, patch){
  const doc = svPlanningById(planId); if(!doc) return;
  doc.additionalQuestions = (doc.additionalQuestions||[]).map(x=>x.id===aqId?Object.assign({},x,patch):x);
  renderSurvBody();
  if(state.db) ensureUpdate(state.db.doc('surv_planning/'+planId), {additionalQuestions: doc.additionalQuestions});
}
function svRemoveAdditionalQuestion(planId, aqId){
  const doc = svPlanningById(planId); if(!doc) return;
  doc.additionalQuestions = (doc.additionalQuestions||[]).filter(x=>x.id!==aqId);
  renderSurvBody();
  if(state.db) ensureUpdate(state.db.doc('surv_planning/'+planId), {additionalQuestions: doc.additionalQuestions});
}
function svComputeScore(doc){
  let wOk=0, wTot=0;
  (doc.questionnaireIds||[]).forEach(qnId=>{
    const qn = svQuestionnaireById(qnId); if(!qn) return;
    (qn.questions||[]).forEach(q=>{
      const a = svGetAnswer(doc, qnId, q.id);
      const status = a ? a.status : 'conform'; // unanswered defaults to conforme not yet reviewed — but excluded below if truly unanswered
      if(!a) return; // don't count unanswered questions yet
      if(status==='na') return;
      const w = parseFloat(q.weight)||0;
      wTot += w; if(status==='conform') wOk += w;
    });
  });
  return wTot>0 ? (wOk/wTot*100) : null;
}
async function svCloseExecution(planId){
  const doc = svPlanningById(planId); if(!doc) return;
  const scorePct = svComputeScore(doc);
  // auto-create linked NC records for any non-conforme answer escalated to the tracker, not yet linked
  for(const qnId of (doc.questionnaireIds||[])){
    const qn = svQuestionnaireById(qnId); if(!qn) continue;
    for(const q of (qn.questions||[])){
      const a = svGetAnswer(doc, qnId, q.id);
      if(a && a.status==='nonconform' && a.ncActionType==='immediate_tracker' && !a.ncRecordId){
        const ncId = await ncCreateFromSurveillance({
          source: 'Surveillance '+esc(doc.mode==='planned'?'planifiée':'terrain')+' — '+esc(qn.title),
          description: (q.text?q.text+' — ':'')+(a.ncDescription||''),
          owner: doc.surveyor||'',
        });
        a.ncRecordId = ncId;
      }
    }
  }
  svUpdatePlanning(planId, {status:'done', doneDate:todayISO(), scorePct, answers:doc.answers});
}
function svSaveDraft(planId){ svUpdatePlanning(planId, {status:'draft'}); }

function svRenderQAnswerBlock(doc, qn, q, readOnly){

        <option value="temporaire" ${a.naType==='temporaire'?'selected':''}>Temporaire (liée aux circonstances)</option>
        <option value="permanente" ${a.naType==='permanente'?'selected':''}>Permanente (liée à la prestation)</option>

      <div class="seg">${seg('conform','Conforme','ok')}${seg('nonconform','Non conforme','nok')}${seg('na','N/A','na')}</div>

function svWireExecutor(doc, readOnly){
  document.getElementById('svExecBack').addEventListener('click', ()=>{ sv().execId=null; sv().consultMode=false; renderSurvBody(); });
  const main = document.querySelector('#svMain');
  main.querySelectorAll('[data-field]').forEach(el=>{
    if(el.id==='svQualToggle') return;
    el.addEventListener('change', ()=>{ svUpdatePlanning(doc.id, {[el.dataset.field]: el.value}); });
  });
  const qualToggle = document.getElementById('svQualToggle');
  if(qualToggle) qualToggle.addEventListener('change', ()=>svUpdatePlanning(doc.id, {isQualificationRun: qualToggle.checked}));
  const addQnSel = document.getElementById('svAddQnSel');
  if(addQnSel) addQnSel.addEventListener('change', ()=>{ if(addQnSel.value) svAddQuestionnaireToExec(doc.id, addQnSel.value); });
  main.querySelectorAll('[data-rmqn]').forEach(b=>b.addEventListener('click', ()=>svRemoveQuestionnaireFromExec(doc.id, b.dataset.rmqn)));
  main.querySelectorAll('.qanswer-block [data-setstatus]').forEach(btn=>btn.addEventListener('click', ()=>{
    const block = btn.closest('.qanswer-block');
    svSetAnswer(doc.id, block.dataset.qnid, block.dataset.qid, {status: btn.dataset.setstatus});
  }));
  main.querySelectorAll('.qanswer-block [data-afield2]').forEach(el=>el.addEventListener('change', ()=>{
    const block = el.closest('.qanswer-block');
    svSetAnswer(doc.id, block.dataset.qnid, block.dataset.qid, {[el.dataset.afield2]: el.value});
  }));
  const addAddQ = document.getElementById('svAddAddQBtn');
  if(addAddQ) addAddQ.addEventListener('click', ()=>svAddAdditionalQuestion(doc.id));
  main.querySelectorAll('.addqn-row').forEach(row=>{
    row.querySelectorAll('[data-afield]').forEach(el=>el.addEventListener('change', ()=>svUpdateAdditionalQuestion(doc.id, row.dataset.aqid, {[el.dataset.afield]: el.value})));
    const del = row.querySelector('[data-adel]'); if(del) del.addEventListener('click', ()=>svRemoveAdditionalQuestion(doc.id, row.dataset.aqid));
  });
  const draftBtn = document.getElementById('svSaveDraftBtn'); if(draftBtn) draftBtn.addEventListener('click', ()=>svSaveDraft(doc.id));
  const closeBtn = document.getElementById('svCloseBtn'); if(closeBtn) closeBtn.addEventListener('click', ()=>{
    if((doc.questionnaireIds||[]).length===0){ alert('Ajoute au moins un questionnaire avant de clôturer.'); return; }
    svCloseExecution(doc.id);
  });
}

/* ---- Qualification: validate a supervised run, promote N→L→Q ---- */
function svValidateQualification(planId){
  const doc = svPlanningById(planId); if(!doc) return;
  const validator = prompt('Nom du valideur (surveillant qualifié / tuteur) :', doc.qualificationSurveyor||''); if(!validator) return;
  svUpdatePlanning(planId, {qualificationValidated:true, qualificationValidatedBy:validator.trim(), qualificationValidatedDate:todayISO()});
  const surveyor = svSurveyorByName(doc.surveyor);
  if(surveyor){
    const cur = (surveyor.quals||{})[doc.familyCode] || 'N';
    const next = QUAL_LEVELS[Math.min(QUAL_LEVELS.indexOf(cur)+1, QUAL_LEVELS.length-1)];
    svSetQual(surveyor.id, doc.familyCode, next);
  }
}

/* ---- KPI helpers: gather per-question stats across all closed surveillances ---- */
function svGatherQStats(done){
  const qStats = {};
  done.forEach(p=>(p.answers||[]).forEach(a=>{
    if(a.status==='na') return;
    const key = a.questionnaireId+'::'+a.questionId;
    if(!qStats[key]){
      const qn = svQuestionnaireById(a.questionnaireId);
      const q = qn && (qn.questions||[]).find(x=>x.id===a.questionId);
      qStats[key] = {text: (q&&q.text) || '(question supprimée)', total:0, nonconform:0};
    }
    qStats[key].total++;
    if(a.status==='nonconform') qStats[key].nonconform++;
  }));
  return qStats;
}

/* ---- Render: Résultats & KPI (v2 — adherence, count-based pass rate, dual Pareto, family × prestation) ---- */
function renderSvKpi(holder){
  const year = today.getFullYear();
  const done = sv().planning.filter(p=>p.status==='done');
  const doneThisYear = done.filter(p=>(p.doneDate||'').startsWith(String(year)));
  const avgByFam = {};
  SURV_FAMILIES.forEach(f=>{ const ds = done.filter(p=>p.familyCode===f.code && p.scorePct!=null); avgByFam[f.code] = ds.length ? ds.reduce((s,p)=>s+p.scorePct,0)/ds.length : null; });

  let totalAnswered=0, totalConform=0;
  done.forEach(p=>(p.answers||[]).forEach(a=>{ if(a.status==='na') return; totalAnswered++; if(a.status==='conform') totalConform++; }));
  const passRate = totalAnswered ? (totalConform/totalAnswered*100) : null;

  const plannedTotal = sv().planning.filter(p=>p.mode==='planned').length;
  const plannedDone = sv().planning.filter(p=>p.mode==='planned' && p.status==='done').length;
  const adherence = plannedTotal ? (plannedDone/plannedTotal*100) : null;

  const targetVolumeSum = SURV_FAMILIES.reduce((s,f)=>{ const o=svObjectiveDoc(f.code, year); return s+(o?(parseFloat(o.targetVolume)||0):0); }, 0);

  const qStats = svGatherQStats(done);
  const byVolume = Object.values(qStats).filter(x=>x.nonconform>0).sort((a,b)=>b.nonconform-a.nonconform).slice(0,10);
  const maxVol = byVolume.length ? byVolume[0].nonconform : 1;
  const byRatio = Object.values(qStats).filter(x=>x.total>=3 && x.nonconform>0).map(x=>Object.assign({}, x, {ratio:x.nonconform/x.total*100})).sort((a,b)=>b.ratio-a.ratio).slice(0,10);

  const prestCounts = {};
  done.forEach(p=>{ if(p.prestation) prestCounts[p.prestation] = (prestCounts[p.prestation]||0)+1; });
  const topPrestations = Object.keys(prestCounts).sort((a,b)=>prestCounts[b]-prestCounts[a]).slice(0,6);

  holder.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Indicateurs clés</h2><div class="sub">${year} — toutes familles confondues</div></div>
      <div class="kpi-grid">
        <div class="kpi" style="--c:var(--m-surv)"><div class="khead"><span class="kbadge">%</span><span class="kname">Taux de réussite</span></div>
          <div class="ktarget">Réponses conformes / réponses évaluées (hors N/A)</div>
          <div class="kstat"><span class="kactual" style="color:${passRate==null?'var(--ink-faint)':passRate>=80?'var(--ok)':'var(--nok)'}">${passRate==null?'—':Math.round(passRate)+'%'}</span></div></div>
        <div class="kpi" style="--c:var(--m-surv)"><div class="khead"><span class="kbadge">⟳</span><span class="kname">Adhérence au plan</span></div>
          <div class="ktarget">Surveillances planifiées réalisées / planifiées</div>
          <div class="kstat"><span class="kactual" style="color:${adherence==null?'var(--ink-faint)':adherence>=80?'var(--ok)':'var(--nok)'}">${adherence==null?'—':Math.round(adherence)+'%'}</span></div></div>
        <div class="kpi" style="--c:var(--m-surv)"><div class="khead"><span class="kbadge">Σ</span><span class="kname">Volume réalisé ${year}</span></div>
          <div class="ktarget">vs objectif cumulé ${targetVolumeSum||'—'}</div>
          <div class="kstat"><span class="kactual" style="color:${targetVolumeSum && doneThisYear.length<targetVolumeSum?'var(--nok)':'var(--ok)'}">${doneThisYear.length}</span></div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Score moyen par famille</h2></div>
      <div class="kpi-grid">
        ${SURV_FAMILIES.map(f=>{
          const avg = avgByFam[f.code]; const cnt = done.filter(p=>p.familyCode===f.code).length;
          return `<div class="kpi" style="--c:var(--m-surv)"><div class="khead"><span class="kbadge">${f.code.replace('OS','')}</span><span class="kname">${esc(f.name)}</span></div>
            <div class="ktarget">${cnt} surveillance${cnt===1?'':'s'} réalisée${cnt===1?'':'s'}</div>
            <div class="kstat"><span class="kactual" style="color:${avg==null?'var(--ink-faint)':avg>=80?'var(--ok)':'var(--nok)'}">${avg==null?'—':Math.round(avg)+'%'}</span></div></div>`;
        }).join('')}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Pareto des non-conformités — en volume</h2><div class="sub">Nombre d’occurrences non conformes, toutes surveillances terminées</div></div>
      <div class="fail-list">${byVolume.length ? byVolume.map(f=>`
        <div class="fail-row"><div class="fq">${esc(f.text)}</div><div class="fbar-wrap"><div class="fbar" style="width:${(f.nonconform/maxVol*100).toFixed(0)}%"></div></div><div class="fn">${f.nonconform}</div></div>`).join('')
        : `<div style="color:var(--ink-faint); font-size:13px;">Pas encore de non-conformité enregistrée.</div>`}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Pareto des non-conformités — en ratio</h2><div class="sub">% de non-conformité sur les questions posées au moins 3 fois — révèle les points systémiquement fragiles</div></div>
      <div class="fail-list">${byRatio.length ? byRatio.map(f=>`
        <div class="fail-row"><div class="fq">${esc(f.text)}</div><div class="fbar-wrap"><div class="fbar" style="width:${f.ratio.toFixed(0)}%"></div></div><div class="fn">${Math.round(f.ratio)}%</div></div>`).join('')
        : `<div style="color:var(--ink-faint); font-size:13px;">Pas assez d’échantillon (min. 3 réponses par question) pour un ratio significatif.</div>`}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Répartition famille × prestation</h2><div class="sub">Nombre de surveillances terminées, top 6 prestations</div></div>
      ${topPrestations.length ? `<div class="table-wrap"><table class="mtable matrix-table">
        <thead><tr><th>Famille</th>${topPrestations.map(pr=>`<th>${esc(pr)}</th>`).join('')}</tr></thead>
        <tbody>${SURV_FAMILIES.map(f=>`<tr><td>${f.code}</td>${topPrestations.map(pr=>{
          const ds = done.filter(p=>p.familyCode===f.code && p.prestation===pr);
          if(!ds.length) return `<td style="color:var(--ink-faint)">–</td>`;
          const avg = ds.reduce((s,p)=>s+(p.scorePct||0),0)/ds.length;
          return `<td style="color:${avg>=80?'var(--ok)':'var(--nok)'}; font-weight:700;">${ds.length}</td>`;
        }).join('')}</tr>`).join('')}</tbody>
      </table></div>` : `<div class="panel-body" style="color:var(--ink-faint); font-size:13px;">Renseigne le champ « Prestation » lors des surveillances pour faire apparaître cette matrice.</div>`}
    </div>`;
}

    </div>`;
  }).join('');
  grid.querySelectorAll('[data-fam]').forEach(inp=>inp.addEventListener('change', ()=>svSetObjectiveField(inp.dataset.fam, year, inp.dataset.field, parseFloat(inp.value)||0)));

function ncOptIndex(arr, val){ return arr.indexOf(val)+1; }
function ncComputeLevel(d){
  if(d.deviationType==='FOD' || d.deviationType==='HSE') return 3;
  const g1=ncOptIndex(NC_G1_OPTIONS,d.g1), g2=ncOptIndex(NC_G2_OPTIONS,d.g2), o=ncOptIndex(NC_O_OPTIONS,d.o), dd=ncOptIndex(NC_D_OPTIONS,d.d);
  if(!g1||!g2||!o||!dd) return null;
  if(g1===1 && g2===1 && o===1 && (dd===1||dd===2)) return 1;
  const isL3 = (g1===3&&dd===3) || ((g1===1||g1===2)&&g2===3&&o===3&&dd===3) || (g1===3&&g2===3&&(dd===1||dd===2)) || (g1===2&&g2===3&&o===3&&(dd===1||dd===2));
  return isL3 ? 3 : 2;
}

      evolutionBy:'', evolutionDate:'',
      closedBy:'', closedDate:'', closedSignature:'',
    }
  };

function ncNormalizeRecord(raw){
  const blank = ncBlankRecord(raw.projectId);
  // tolerate v1-shaped docs (declared/analysis/action/verify/closed status keys, flat fields) written before this upgrade
  const legacyStatusMap = {declared:'open', analysis:'processing', action:'processing', verify:'verify', closed:'closed'};
  const patch = {};
  if(raw.status && legacyStatusMap[raw.status] && !NC_STAGE_KEYS.includes(raw.status)) patch.status = legacyStatusMap[raw.status];
  if(!raw.number && raw.ref) patch.number = raw.ref;
  if(!raw.productActivity && raw.source) patch.productActivity = raw.source;
  if(!raw.what && raw.description) patch.what = raw.description;
  if(!raw.distribution && raw.owner) patch.distribution = raw.owner;
  const merged = Object.assign({}, blank, raw, patch);
  merged.eightD = Object.assign({}, blank.eightD, raw.eightD||{});
  if(!Array.isArray(merged.decisionActions)) merged.decisionActions=[];
  if(!Array.isArray(merged.proposedActions)) merged.proposedActions=[];
  if(!Array.isArray(merged.fiveWhy) || merged.fiveWhy.length!==5) merged.fiveWhy = blank.fiveWhy;
  if(!Array.isArray(merged.eightD.team)) merged.eightD.team=[];
  if(!Array.isArray(merged.eightD.containmentActions)) merged.eightD.containmentActions=[];
  if(!Array.isArray(merged.eightD.correctiveActions)) merged.eightD.correctiveActions=[];
  if(!Array.isArray(merged.eightD.rca)) merged.eightD.rca=[];
  if(!Array.isArray(merged.eightD.generalizeRows)) merged.eightD.generalizeRows=[];
  if(typeof merged.eightD.ishikawa!=='object' || !merged.eightD.ishikawa) merged.eightD.ishikawa={};
  return merged;
}
function ncSubscribe(pid){
  ncSubs.forEach(u=>{try{u();}catch(e){}}); ncSubs=[]; ncSubsProj=pid;
  ncInitState();
  if(!state.db) return;
  ncSubs.push(state.db.collection('nc_records').where('projectId','==',pid).onSnapshot(qs=>{
    nc().records = qs.docs.map(d=>ncNormalizeRecord(Object.assign({id:d.id}, d.data())));
    nc().records.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    renderNcBody(); renderRail();
  }, e=>console.warn(e)));
}
function mountNc(main){
  const pid = currentProject().id;
  if(ncSubsProj!==pid){ ncSubscribe(pid); } else if(!state.nc){ ncInitState(); }
  main.innerHTML = `<div class="mtabs" id="ncTabs"></div><div class="view-pad" style="padding-top:14px;" id="ncMain"></div>`;

function ncNextNumber(){
  let max=0;
  nc().records.forEach(r=>{ const m=/^NC-(\d+)$/.exec(r.number||''); if(m) max=Math.max(max, parseInt(m[1],10)); });
  return 'NC-'+String(max+1).padStart(3,'0');
}
async function ncStartNew(){
  const pid = currentProject().id;
  const data = Object.assign(ncBlankRecord(pid), {number: ncNextNumber(), issuer: me.name||''});
  if(state.db){ const ref=await state.db.collection('nc_records').add(data); const doc=ncNormalizeRecord(Object.assign({id:ref.id},data)); nc().records.push(doc); nc().detailId=doc.id; }
  else { const doc=ncNormalizeRecord(Object.assign({id:uid()},data)); nc().records.push(doc); nc().detailId=doc.id; }
  renderNcBody();
}
async function ncCreateFromSurveillance(patch){
  const pid = currentProject().id;
  const data = Object.assign(ncBlankRecord(pid), {number: ncNextNumber(), deviationType:'Product NC', assignment:'Internal',
    productActivity: patch.source||'', what: patch.description||'', distribution: patch.owner||''});
  if(state.db){ const ref=await state.db.collection('nc_records').add(data); const doc=ncNormalizeRecord(Object.assign({id:ref.id},data)); nc().records.push(doc); renderNcBody(); return ref.id; }
  const id=uid(); const doc=ncNormalizeRecord(Object.assign({id},data)); nc().records.push(doc); renderNcBody(); return id;
}
function ncRecordById(id){ return nc().records.find(r=>r.id===id); }
function ncUpdateRecord(id, patch){
  const r=ncRecordById(id); if(r) Object.assign(r, patch);
  renderNcBody();
  if(state.db && !String(id).startsWith('id-')) ensureUpdate(state.db.doc('nc_records/'+id), patch);
}
function ncPatchField(id, field, value){ ncUpdateRecord(id, {[field]: value}); }
function ncPatch8D(id, subfield, value){
  const doc = ncRecordById(id); if(!doc) return;
  const eightD = Object.assign({}, doc.eightD, {[subfield]: value});
  ncUpdateRecord(id, {eightD});
}
function ncDeleteRecord(id){
  if(!confirm('Supprimer cette fiche de non-conformité ?')) return;
  nc().records = nc().records.filter(x=>x.id!==id);
  if(nc().detailId===id) nc().detailId=null;
  renderNcBody();
  if(state.db) state.db.doc('nc_records/'+id).delete().catch(()=>{});
}
function ncCloseRecord(id){
  const doc = ncRecordById(id); if(!doc) return;
  const name = prompt('Nom du Quality Manager (ou représentant désigné) visant la clôture :', doc.closureName||me.name||''); if(!name) return;
  const level = ncComputeLevel(doc);
  const patch = {status:'closed'};
  if(level===3){
    patch.eightD = Object.assign({}, doc.eightD, {closedBy:name.trim(), closedDate: doc.eightD.closedDate||todayISO()});
  } else {
    patch.qmCheckDate = todayISO();
    if(!doc.closureName) patch.closureName = name.trim();
    if(!doc.closureDate) patch.closureDate = todayISO();
  }
  ncUpdateRecord(id, patch);
}
function ncReopenRecord(id){
  if(!confirm('Rouvrir cette fiche ? Le visa de clôture sera effacé.')) return;
  const doc = ncRecordById(id); if(!doc) return;
  const level = ncComputeLevel(doc);
  const patch = {status:'verify'};
  if(level===3){ patch.eightD = Object.assign({}, doc.eightD, {closedBy:'', closedDate:''}); }
  else { patch.qmCheckDate = ''; }
  ncUpdateRecord(id, patch);
}

/* ---- Action table (Decision / Proposed / Containment / Corrective) — shared shape ---- */
function ncGetArr(doc, path){ return path.startsWith('8d.') ? (doc.eightD[path.slice(3)]||[]) : (doc[path]||[]); }
function ncSetArr(id, path, arr){
  if(path.startsWith('8d.')) ncPatch8D(id, path.slice(3), arr);
  else ncUpdateRecord(id, {[path]: arr});
}
function ncAddActionRow(id, path){
  const doc = ncRecordById(id);
  const arr = ncGetArr(doc, path).concat([{action:'',type:'',who:'',targetDate:'',newTarget:'',endDate:'',status:'To be done'}]);
  ncSetArr(id, path, arr);
}
function ncUpdateActionRow(id, path, idx, field, value){
  const doc = ncRecordById(id);
  const arr = ncGetArr(doc, path).slice(); arr[idx] = Object.assign({}, arr[idx], {[field]: value});
  ncSetArr(id, path, arr);
}
function ncRemoveActionRow(id, path, idx){
  const doc = ncRecordById(id);
  const arr = ncGetArr(doc, path).slice(); arr.splice(idx,1);
  ncSetArr(id, path, arr);
}
function ncRenderActionTable(doc, path, title, readOnly){

    : `<div style="display:flex; justify-content:flex-end; padding:10px 18px 0;">${readOnly?'':`<button class="addbtn" data-addrow="${path}">+ Action</button>`}</div>`;

    <tr data-idx="${i}">
      <td><input data-afield="action" value="${esc(row.action)}" ${readOnly?'disabled':''}></td>
      <td><select data-afield="type" ${readOnly?'disabled':''}><option value="">—</option>${NC_ACTION_TYPE.map(t=>`<option ${row.type===t?'selected':''}>${t}</option>`).join('')}</select></td>

      <td><input type="date" data-afield="targetDate" value="${esc(row.targetDate)}" ${readOnly?'disabled':''}></td>
      <td><input type="date" data-afield="newTarget" value="${esc(row.newTarget)}" ${readOnly?'disabled':''}></td>

    </tr>`).join('') : `<tr><td colspan="${readOnly?7:8}" style="color:var(--ink-faint); text-align:center;">Aucune action.</td></tr>`;
  return `${head}<div class="table-wrap"><table class="mtable" data-tablepath="${path}">
    <thead><tr><th>Action</th><th>Type</th><th>Qui</th><th>Cible</th><th>Nvl. cible</th><th>Fin</th><th>Statut</th>${readOnly?'':'<th></th>'}</tr></thead>
    <tbody>${body}</tbody>
  </table></div>`;
}
function ncWireActionTable(holder, id, path, readOnly){
  const btn = holder.querySelector(`[data-addrow="${path}"]`); if(btn) btn.addEventListener('click', ()=>ncAddActionRow(id,path));
  const table = holder.querySelector(`table[data-tablepath="${path}"]`); if(!table) return;
  table.querySelectorAll('tbody tr[data-idx]').forEach(tr=>{
    const idx = parseInt(tr.dataset.idx,10);
    tr.querySelectorAll('[data-afield]').forEach(el=>el.addEventListener('change', ()=>ncUpdateActionRow(id,path,idx,el.dataset.afield,el.value)));
    const del = tr.querySelector('[data-arm]'); if(del) del.addEventListener('click', ()=>ncRemoveActionRow(id,path,idx));
  });
}

  board.querySelectorAll('.drag-handle').forEach(h=>h.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); ncStartDrag(h.closest('.stick'), e); }));
}
function ncStartDrag(card, startEvent){
  const id=card.dataset.id; card.classList.add('dragging');
  const ghost=card.cloneNode(true); ghost.classList.add('drag-ghost'); ghost.classList.remove('dragging'); document.body.appendChild(ghost);
  const move=e=>{
    ghost.style.left=(e.clientX-95)+'px'; ghost.style.top=(e.clientY-24)+'px';
    document.querySelectorAll('#ncBoard .kcol').forEach(c=>c.classList.remove('dragover'));
    const el=document.elementFromPoint(e.clientX,e.clientY); const col=el&&el.closest('.kcol'); if(col) col.classList.add('dragover');
  };
  const up=e=>{
    document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
    card.classList.remove('dragging'); ghost.remove(); document.querySelectorAll('#ncBoard .kcol').forEach(c=>c.classList.remove('dragover'));
    const el=document.elementFromPoint(e.clientX,e.clientY); const col=el&&el.closest('.kcol');
    if(col && col.dataset.status!=='closed'){ ncUpdateRecord(id, {status:col.dataset.status}); }
    else if(col && col.dataset.status==='closed'){ ncCloseRecord(id); }
  };
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); move(startEvent);
}

/* ---- Render: Indicateurs ---- */
function renderNcKpi(holder){
  const total = nc().records.length;
  const closed = nc().records.filter(r=>r.status==='closed').length;
  const byLevel = {1:0,2:0,3:0};
  nc().records.forEach(r=>{ const l=ncComputeLevel(r); if(l) byLevel[l]++; });
  const today0 = todayISO();
  let overdue=0;
  const allActionArrays = r=>[].concat(r.decisionActions||[], r.proposedActions||[], (r.eightD&&r.eightD.containmentActions)||[], (r.eightD&&r.eightD.correctiveActions)||[]);
  nc().records.forEach(r=>allActionArrays(r).forEach(a=>{ if(a.status!=='Done' && a.targetDate && a.targetDate<today0) overdue++; }));
  const themeCounts={};
  nc().records.forEach(r=>{ const t=r.themeOfRootCause || (r.eightD&&r.eightD.themeOfRootCause); if(t) themeCounts[t]=(themeCounts[t]||0)+1; });
  const themeList = Object.entries(themeCounts).sort((a,b)=>b[1]-a[1]);
  const maxTheme = themeList.length ? themeList[0][1] : 1;
  const typeCounts={};
  nc().records.forEach(r=>{ if(r.deviationType) typeCounts[r.deviationType]=(typeCounts[r.deviationType]||0)+1; });
  const typeList = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]);
  const maxType = typeList.length ? typeList[0][1] : 1;
  holder.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Vue d’ensemble</h2></div>
      <div class="kpi-grid">
        <div class="kpi" style="--c:var(--m-nc)"><div class="khead"><span class="kbadge">Σ</span><span class="kname">Fiches ouvertes</span></div><div class="ktarget">Sur ${total} au total</div><div class="kstat"><span class="kactual">${total-closed}</span></div></div>
        <div class="kpi" style="--c:var(--m-nc)"><div class="khead"><span class="kbadge">1</span><span class="kname">Niveau 1 — Secondaire</span></div><div class="ktarget">Curatif seul</div><div class="kstat"><span class="kactual">${byLevel[1]}</span></div></div>
        <div class="kpi" style="--c:var(--m-nc)"><div class="khead"><span class="kbadge">2</span><span class="kname">Niveau 2 — Mineure</span></div><div class="ktarget">5-Why + actions</div><div class="kstat"><span class="kactual">${byLevel[2]}</span></div></div>
        <div class="kpi" style="--c:var(--m-nc)"><div class="khead"><span class="kbadge">3</span><span class="kname">Niveau 3 — Majeure</span></div><div class="ktarget">8D complet</div><div class="kstat"><span class="kactual" style="color:${byLevel[3]>0?'var(--nok)':'inherit'}">${byLevel[3]}</span></div></div>
        <div class="kpi" style="--c:var(--m-nc)"><div class="khead"><span class="kbadge">⏰</span><span class="kname">Actions en retard</span></div><div class="ktarget">Toutes fiches, date cible dépassée</div><div class="kstat"><span class="kactual" style="color:${overdue>0?'var(--nok)':'var(--ok)'}">${overdue}</span></div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Répartition par thème de cause racine</h2><div class="sub">Niveau 2 et Niveau 3 confondus</div></div>
      <div class="fail-list">${themeList.length ? themeList.map(([t,c])=>`<div class="fail-row"><div class="fq">${esc(t)}</div><div class="fbar-wrap"><div class="fbar" style="width:${(c/maxTheme*100).toFixed(0)}%"></div></div><div class="fn">${c}</div></div>`).join('') : `<div style="color:var(--ink-faint); font-size:13px;">Pas encore de thème de cause racine renseigné.</div>`}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Répartition par type de non-conformité</h2></div>
      <div class="fail-list">${typeList.length ? typeList.map(([t,c])=>`<div class="fail-row"><div class="fq">${esc(t)}</div><div class="fbar-wrap"><div class="fbar" style="width:${(c/maxType*100).toFixed(0)}%"></div></div><div class="fn">${c}</div></div>`).join('') : `<div style="color:var(--ink-faint); font-size:13px;">Aucune fiche pour l’instant.</div>`}</div>
    </div>`;
}

function ncRenderIshikawaBlock(doc, readOnly){
  const answers = doc.eightD.ishikawa||{};
  const cats = [];
  NC_ISHIKAWA_FACTORS.forEach(f=>{ if(!cats.includes(f.cat)) cats.push(f.cat); });
  return cats.map(cat=>{
    const rows = NC_ISHIKAWA_FACTORS.filter(f=>f.cat===cat);
    return `<div class="ishikawa-cat">${esc(cat)}</div>` + rows.map(f=>{
      const a = answers[f.ref] || {answer:'', comment:''};
      const seg = (val,label,cls)=>`<button class="${a.answer===val?'active '+cls:''}" data-ikanswer="${f.ref}" data-val="${val}" ${readOnly?'disabled':''}>${label}</button>`;
      return `<div class="ishikawa-row">
        <span class="iref">${f.ref}</span>
        <span class="ilabel">${esc(f.label)}</span>
        <div class="seg-yna">${seg('Y','Y','y')}${seg('N','N','n')}${seg('NA','NA','na2')}</div>
        <input data-ikcomment="${f.ref}" placeholder="Explication si Y" value="${esc(a.comment)}" ${readOnly||a.answer!=='Y'?'disabled':''}>
      </div>`;
    }).join('');
  }).join('');
}
function ncRenderRcaBlocks(doc, readOnly){
  const rca = doc.eightD.rca||[];

  if(!rca.length) return `<div style="padding:0 18px 14px; color:var(--ink-faint); font-size:12.5px;">Aucun facteur analysé pour l’instant. Marque un facteur Y ci-dessus, puis clique « + Facteur à analyser ».</div>`;
  return rca.map((r,i)=>`
    <div class="rca-block" data-idx="${i}">

}

        <div class="field"><label>Date d’affectation</label><input type="date" data-8dfield="dateAssigned" value="${esc(doc.eightD.dateAssigned)}" ${dis}></div>
      </div>
      <div style="margin-top:8px;">
        ${(doc.eightD.team||[]).map((t,i)=>`<div class="team-row" data-idx="${i}">
          <input data-tfield="name" placeholder="Nom" value="${esc(t.name)}" ${dis}>
          <div style="display:flex; gap:6px;">
            <input data-tfield="function" placeholder="Fonction" value="${esc(t.function)}" style="flex:1;" ${dis}>
            ${readOnly?'':'<button class="qdel" data-tdel>&times;</button>'}
          </div>
        </div>`).join('')}
      </div>
      ${readOnly?'':'<div style="padding-top:8px;"><button class="addbtn" id="nc8dAddTeam">+ Membre de l’équipe</button></div>'}
    </div>
  </div>
  <div class="panel">
    <div class="dstep"><span class="dbadge">D2</span><span class="dtitle">Décrire le problème<span class="dsub"> · identification, 5W2H+R et G1/G2/O/D — voir ci-dessus</span></span></div>
  </div>

    <div class="dstep"><span class="dbadge">D3</span><span class="dtitle">Actions de confinement<span class="dsub"> · à mettre en place sous 48h</span></span></div>

  <div class="panel">
    <div class="dstep"><span class="dbadge">D4</span><span class="dtitle">Déterminer les causes racines<span class="dsub"> · Ishikawa (5M) + RCA 5-Pourquoi</span></span></div>
    ${ncRenderIshikawaBlock(doc, readOnly)}
    <div class="panel-head"><h2>RCA — Analyse des 5 Pourquoi</h2><div class="sub">Jusqu’à 3 facteurs causaux investigués, choisis parmi les facteurs marqués Y ci-dessus</div>

/* ---- Render: detail page assembler ---- */
function renderNcDetail(holder){
  const doc = ncRecordById(nc().detailId);
  if(!doc){ nc().detailId=null; renderNcBody(); return; }
  const readOnly = doc.status==='closed';
  const level = ncComputeLevel(doc);
  const levelCls = level?'level'+level:'none';
  const levelLabel = level ? ('Niveau '+level+' — '+(level===1?'Secondaire':level===2?'Mineure':'Majeure')) : 'Niveau non déterminé';
  holder.innerHTML = `
    <div class="panel">
      <div class="exec-head">
        <button class="linkbtn" id="ncBackBtn">← Retour au registre</button>
        <span class="badge-mode ${readOnly?'locked':''}">${esc(doc.number)||'(brouillon)'}</span>
        <span class="crit-level ${levelCls}">${levelLabel}</span>
        ${readOnly?'<span class="pill ok">Clôturée</span>':''}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Identification</h2></div>
      ${ncRenderIdentification(doc, readOnly)}
    </div>
    <div class="panel">
      ${ncRenderCriticality(doc, readOnly)}
    </div>
    ${level===3 ? ncRender8DPanel(doc, readOnly) : ncRenderF1021Panel(doc, readOnly, level)}
  `;
  ncWireDetail(doc, readOnly, level);
}

/* ---- Wire: detail page events ---- */
function ncWireDetail(doc, readOnly, level){
  const main = document.getElementById('ncMain');
  const back = document.getElementById('ncBackBtn'); if(back) back.addEventListener('click', ()=>{ nc().detailId=null; renderNcBody(); });
  const reopenBtn = document.getElementById('ncReopenBtn'); if(reopenBtn) reopenBtn.addEventListener('click', ()=>ncReopenRecord(doc.id));
  if(readOnly) return;

  main.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const field = el.dataset.field;
      const value = (el.type==='number') ? (parseFloat(el.value)||0) : el.value;
      ncPatchField(doc.id, field, value);
    });
  });

  const fwTable = document.getElementById('ncFiveWhyTable');
  if(fwTable){
    fwTable.querySelectorAll('tbody tr[data-row]').forEach(tr=>{
      const idx = parseInt(tr.dataset.row,10);
      tr.querySelectorAll('[data-fwfield]').forEach(el=>el.addEventListener('change', ()=>ncUpdateFiveWhy(doc.id, idx, el.dataset.fwfield, el.value)));
    });
  }

  ncWireActionTable(main, doc.id, 'decisionActions', readOnly);
  ncWireActionTable(main, doc.id, 'proposedActions', readOnly);

  const closeBtn = document.getElementById('ncCloseBtn'); if(closeBtn) closeBtn.addEventListener('click', ()=>ncCloseRecord(doc.id));

  if(level===3){
    main.querySelectorAll('[data-8dfield]').forEach(el=>{
      el.addEventListener('change', ()=>ncPatch8D(doc.id, el.getAttribute('data-8dfield'), el.value));
    });
    ncWireActionTable(main, doc.id, '8d.containmentActions', readOnly);
    ncWireActionTable(main, doc.id, '8d.correctiveActions', readOnly);

    const addTeam = document.getElementById('nc8dAddTeam'); if(addTeam) addTeam.addEventListener('click', ()=>ncAddTeamRow(doc.id));
    main.querySelectorAll('.team-row[data-idx]').forEach(row=>{
      const idx = parseInt(row.dataset.idx,10);
      row.querySelectorAll('[data-tfield]').forEach(el=>el.addEventListener('change', ()=>ncUpdateTeamRow(doc.id, idx, el.dataset.tfield, el.value)));
      const del = row.querySelector('[data-tdel]'); if(del) del.addEventListener('click', ()=>ncRemoveTeamRow(doc.id, idx));
    });

    main.querySelectorAll('[data-ikanswer]').forEach(btn=>{
      btn.addEventListener('click', ()=>ncSetIshikawaAnswer(doc.id, btn.getAttribute('data-ikanswer'), btn.dataset.val));
    });
    main.querySelectorAll('[data-ikcomment]').forEach(el=>{
      el.addEventListener('change', ()=>ncSetIshikawaComment(doc.id, el.getAttribute('data-ikcomment'), el.value));
    });

    const addRca = document.getElementById('nc8dAddRca'); if(addRca) addRca.addEventListener('click', ()=>ncAddRcaBlock(doc.id));
    main.querySelectorAll('.rca-block[data-idx]').forEach(block=>{
      const idx = parseInt(block.dataset.idx,10);
      block.querySelectorAll('[data-rfield]').forEach(el=>el.addEventListener('change', ()=>ncUpdateRcaBlock(doc.id, idx, el.dataset.rfield, el.value)));
      block.querySelectorAll('[data-rwhy]').forEach(el=>el.addEventListener('change', ()=>ncUpdateRcaWhy(doc.id, idx, parseInt(el.dataset.rwhy,10), el.value)));
      const del = block.querySelector('[data-rdel]'); if(del) del.addEventListener('click', ()=>ncRemoveRcaBlock(doc.id, idx));
    });

    const addGen = document.getElementById('nc8dAddGen'); if(addGen) addGen.addEventListener('click', ()=>ncAddGenRow(doc.id));
    main.querySelectorAll('.gen-row[data-idx]').forEach(row=>{
      const idx = parseInt(row.dataset.idx,10);
      row.querySelectorAll('[data-gfield]').forEach(el=>el.addEventListener('change', ()=>ncUpdateGenRow(doc.id, idx, el.dataset.gfield, el.value)));
      const del = row.querySelector('[data-gdel]'); if(del) del.addEventListener('click', ()=>ncRemoveGenRow(doc.id, idx));
    });
  }
}

/* =========================================================================
   ADMINISTRATION  (Firebase-hosted version only — who can see which module.
   Manages the allowed_emails collection from inside the app: each doc's id
   is the person's email, holding {modules:[...], isAdmin:bool}. An admin
   always has full access to every module regardless of `modules`.)
   ========================================================================= */
const ACCESS_MODULES = [
  {id:'sqcdpte', label:'SQCDPTE'},
  {id:'surv', label:'Surveillances'},
  {id:'nc', label:'Non-Conformités'},
];
let adminSubActive = false;
function adminInitState(){ state.admin = { people: [] }; }
function adminSubscribe(){
  if(adminSubActive || !state.db) return;
  adminSubActive = true;
  if(!state.admin) adminInitState();
  state.db.collection('allowed_emails').onSnapshot(qs=>{
    state.admin.people = qs.docs.map(d=>Object.assign({email:d.id}, d.data())).sort((a,b)=>a.email.localeCompare(b.email));
    if(state.route==='admin' && document.getElementById('adminMain')) renderAdmin(document.getElementById('adminMain'));
    if(state.route==='home' && document.getElementById('homeView')) renderHome();
  }, e=>console.warn('admin', e));
}
function mountAdmin(main){
  if(!state.admin) adminInitState();
  adminSubscribe();
  main.innerHTML = `<div class="view-pad" id="adminMain"></div>`;
  renderAdmin(document.getElementById('adminMain'));
}
function adminOtherAdminsCount(email){
  return state.admin.people.filter(p=>p.email!==email && p.isAdmin===true).length;
}
function adminPersonRow(p){
  const myEmail = (currentUser && currentUser.email || '').toLowerCase();
  const isMe = p.email === myEmail;
  const modChecks = ACCESS_MODULES.map(m=>`
    <td style="text-align:center;"><input type="checkbox" data-modchk="${m.id}" ${(p.modules||[]).includes(m.id)?'checked':''} ${p.isAdmin?'disabled':''}></td>`).join('');
  return `<tr data-email="${esc(p.email)}">
    <td class="nc-num">${esc(p.email)}${isMe?' <span class="pill na">toi</span>':''}</td>
    ${modChecks}
    <td style="text-align:center;"><input type="checkbox" data-adminchk ${p.isAdmin?'checked':''}></td>
    <td><button class="qdel" data-admindel title="Retirer l’accès">&times;</button></td>
  </tr>`;
}
function renderAdmin(holder){
  const people = (state.admin && state.admin.people) || [];
  holder.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Administration — Accès</h2><div class="sub">Qui peut voir quels modules. Un compte Administrateur voit toujours tout.</div></div>
      <div class="panel-body">
        <p style="font-size:12.5px; color:var(--ink-faint); margin:0;">Coche les modules auxquels chaque personne a accès. Les changements prennent effet immédiatement, y compris pour une personne déjà connectée.</p>
      </div>
      <div class="table-wrap"><table class="mtable">
        <thead><tr><th>Adresse courriel</th>${ACCESS_MODULES.map(m=>`<th>${esc(m.label)}</th>`).join('')}<th>Administrateur</th><th></th></tr></thead>
        <tbody id="adminPeopleBody">${people.length ? people.map(adminPersonRow).join('') : `<tr><td colspan="${ACCESS_MODULES.length+3}" style="color:var(--ink-faint); text-align:center; padding:16px;">Personne pour l’instant.</td></tr>`}</tbody>
      </table></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>+ Ajouter une personne</h2></div>
      <div class="panel-body">
        <div class="field" style="max-width:360px;"><label>Adresse courriel</label><input type="email" id="adminNewEmail" placeholder="prenom.nom@entreprise.com"></div>
        <div style="display:flex; gap:18px; flex-wrap:wrap; margin:12px 0;">
          ${ACCESS_MODULES.map(m=>`<label style="display:flex; align-items:center; gap:6px; font-size:13px;"><input type="checkbox" id="adminNewMod_${m.id}"> ${esc(m.label)}</label>`).join('')}
          <label style="display:flex; align-items:center; gap:6px; font-size:13px;"><input type="checkbox" id="adminNewAdmin"> Administrateur</label>
        </div>
        <button class="addbtn" id="adminAddBtn">Ajouter</button>
      </div>
    </div>`;
  adminWire(holder);
}
function adminWire(holder){
  holder.querySelectorAll('tr[data-email]').forEach(tr=>{
    const email = tr.dataset.email;
    tr.querySelectorAll('[data-modchk]').forEach(cb=>cb.addEventListener('change', ()=>{
      const person = state.admin.people.find(p=>p.email===email);
      let modules = (person && Array.isArray(person.modules)) ? person.modules.slice() : [];
      const m = cb.dataset.modchk;
      if(cb.checked){ if(!modules.includes(m)) modules.push(m); } else { modules = modules.filter(x=>x!==m); }
      ensureUpdate(state.db.doc('allowed_emails/'+email), {modules});
    }));
    const adminCb = tr.querySelector('[data-adminchk]');
    if(adminCb) adminCb.addEventListener('change', ()=>{
      if(!adminCb.checked && adminOtherAdminsCount(email)===0){
        alert('Impossible : il doit toujours rester au moins un compte Administrateur.');
        adminCb.checked = true;
        return;
      }
      ensureUpdate(state.db.doc('allowed_emails/'+email), {isAdmin: adminCb.checked});
    });
    const delBtn = tr.querySelector('[data-admindel]');
    if(delBtn) delBtn.addEventListener('click', ()=>{
      const person = state.admin.people.find(p=>p.email===email);
      if(person && person.isAdmin && adminOtherAdminsCount(email)===0){
        alert('Impossible de retirer le dernier compte Administrateur.');
        return;
      }
      if(!confirm('Retirer l’accès de '+email+' à tout l’outil ?')) return;
      state.db.doc('allowed_emails/'+email).delete().catch(e=>alert('Erreur : '+e.message));
    });
  });
  const addBtn = document.getElementById('adminAddBtn');
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    const emailInput = document.getElementById('adminNewEmail');
    const email = (emailInput.value||'').trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ alert('Adresse courriel invalide.'); return; }
    if(state.admin.people.some(p=>p.email===email)){ alert('Cette adresse est déjà dans la liste — modifie-la directement dans le tableau ci-dessus.'); return; }
    const modules = ACCESS_MODULES.map(m=>m.id).filter(id=>{ const el=document.getElementById('adminNewMod_'+id); return el && el.checked; });
    const isAdmin = document.getElementById('adminNewAdmin').checked;
    try{
      await state.db.collection('allowed_emails').doc(email).set({modules, isAdmin, addedBy: (currentUser&&currentUser.email)||'', addedAt: Date.now()});
      emailInput.value = '';
      ACCESS_MODULES.forEach(m=>{ const el=document.getElementById('adminNewMod_'+m.id); if(el) el.checked=false; });
      document.getElementById('adminNewAdmin').checked = false;
    }catch(e){ alert('Erreur : '+e.message); }
  });
}
